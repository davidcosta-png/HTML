<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Contato — Biblioteca Digital UniFECAF</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="site-header"><div class="container header-inner"><a href="index.html" class="logo"><img src="assets/imagens/logo.svg" alt="UniFECAF" class="logo-img"></a></div></header>
  <main class="container section">
    <h1>Contato</h1>
    <p class="muted">Dúvidas, sugestões e suporte. Preencha o formulário ou use os contatos abaixo.</p>
    <form class="card" style="max-width:640px;">
      <label for="name">Nome</label>
      <input id="name" type="text" style="width:100%;padding:0.6rem;border-radius:8px;border:1px solid #e6eef9;margin-bottom:0.6rem;">
      <label for="email">Email</label>
      <input id="email" type="email" style="width:100%;padding:0.6rem;border-radius:8px;border:1px solid #e6eef9;margin-bottom:0.6rem;">
      <label for="message">Mensagem</label>
      <textarea id="message" rows="6" style="width:100%;padding:0.6rem;border-radius:8px;border:1px solid #e6eef9;margin-bottom:0.6rem;"></textarea>
      <button class="btn btn-primary" type="button" onclick="alert('Formulário demo — integrar backend para envio real')">Enviar</button>
    </form>
    <section style="margin-top:1rem;">
      <h3>Contato direto</h3>
      <p><strong>Email:</strong> <a href="mailto:biblioteca@unifecaf.br">biblioteca@unifecaf.br</a></p>
      <p><strong>Telefone:</strong> (11) 4000-0000</p>
    </section>
  </main>
  <footer class="site-footer"><div class="container"><p class="small muted">Versão demonstrativa local.</p></div></footer>
</body>
</html>
